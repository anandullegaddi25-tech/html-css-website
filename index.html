<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web using html and css</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <h1>User login</h1> -->
    <div class="box">
        <div class="card">
    
            <!-- Left Side -->
            <div class="left">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

            </div>
    
            <!-- Right Side -->
            <div class="Right">
                <h2>User Login</h2>
    
                <div class="input-box">
                    <i class="fa fa-envelope"></i>
                    <input type="text" placeholder="Email Id">
                </div>
    
                <div class="input-box">
                    <!-- <i class="fa fa-lock"></i> -->
                    <input type="password" placeholder="Password">
                </div>
    
                <button>Login</button>
                <p 
                    class="forgot">Forgot Username? 
                </p>
                <p
                    class="forgot">Forgot Password?
                </p>

            </div>
    
        </div>
    </div>

</body>
</html>
